{% extends 'basic.html' %}

{% block head %}
{{ super() }}
<title>Reset Password | VConnect</title>

<link rel="stylesheet" href="{{ url_for('static', filename='resetpassword.css') }}">

{% endblock %}

{% block body %}

<div class="container">

    <div class="reset-box">

        <h1>VCONNECT</h1>

        <p>Reset Your Password</p>

        <form action="/resetpassword" method="POST">

            <label>New Password</label>

            <input
                type="password"
                name="newpassword"
                placeholder="Enter New Password"
                required>

            <label>Confirm New Password</label>

            <input
                type="password"
                name="confirmpassword"
                placeholder="Re-enter New Password"
                required>

            {% if message %}

                <p class="MSG">{{ message }}</p>

            {% endif %}

            <input
                type="submit"
                value="UPDATE PASSWORD">

        </form>

        <p class="back">

            <a href="/login">← Back to Login</a>

        </p>

    </div>

</div>

{% endblock %}
