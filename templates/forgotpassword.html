<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | VConnect</title>

    <link rel="icon"
          href="{{ url_for('static', filename='profile_pics/vconnectlogo.jpeg') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='forgotpassword.css') }}">

</head>

<body>

<header>

    <div class="logo">

        <img src="{{ url_for('static', filename='profile_pics/vconnectlogo.jpeg') }}">

        <h1>CONNECT</h1>

    </div>

    <nav>

        <a href="/">Home</a>

        <a href="/#about">About</a>

        <a href="/#contact">Contact</a>

    </nav>

</header>

<div class="container">

    <div class="forgot-box">

        <img src="{{ url_for('static', filename='profile_pics/vconnectlogo.jpeg') }}"
             class="forgot-logo">

        <h2>Forgot Password</h2>

        <p class="subtitle">

            Enter your registered email address to receive a verification OTP.

        </p>

        <form action="/forgotpassword" method="POST">

            <label>Registered Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                value="{{ email if email else '' }}"
                required>

            {% if message %}

                <p class="MSG">

                    {{ message }}

                </p>

            {% endif %}

            {% if otp_sent %}

                <label>Enter OTP</label>

                <input

                    type="text"

                    name="otp"

                    maxlength="6"

                    placeholder="Enter 6-digit OTP"

                    required>

                <input

                    type="submit"

                    name="verifyotp"

                    value="VERIFY OTP">

            {% else %}

                <input

                    type="submit"

                    name="sendotp"

                    value="SEND OTP">

            {% endif %}

        </form>

        <div class="back">

            <a href="/login">

                ← Back to Login

            </a>

        </div>

    </div>

</div>

</body>

</html>
